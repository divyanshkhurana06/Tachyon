<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tachyon in the browser</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --accent: #2563eb; --user: #eff6ff; --error: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --line: #292524; --accent: #60a5fa; --user: #172554; --error: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], select, textarea {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  #model { flex: 1 1 320px; min-width: 0; }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.plain { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  progress { width: 100%; height: 8px; margin-top: 10px; }
  #status { color: var(--muted); font-size: 13px; margin-top: 6px; min-height: 20px; }
  #status.error { color: var(--error); }
  #log { margin: 16px 0; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { background: var(--user); align-self: flex-end; max-width: 85%; }
  .bot { background: var(--panel); border: 1px solid var(--line); }
  .stats { color: var(--muted); font-size: 12px; margin-top: 4px; }
  #ask { display: flex; gap: 8px; }
  #ask textarea { flex: 1; resize: vertical; min-height: 44px; }
</style>
</head>
<body>
<main>
  <h1>Tachyon in the browser</h1>
  <p class="sub">The Tachyon engine compiled to WebAssembly: the same tokenizer, quantizer and transformer, running on your CPU in this tab. Nothing is sent anywhere.</p>

  <div class="card">
    <div class="row">
      <input id="model" type="text" spellcheck="false" aria-label="Model folder URL">
      <select id="format" aria-label="Weight format">
        <option value="1">8-bit</option>
        <option value="2">4-bit (q4m)</option>
        <option value="0">bf16</option>
      </select>
      <button id="load">Load</button>
    </div>
    <progress id="progress" value="0" max="1" hidden></progress>
    <div id="status">Qwen2.5-0.5B-Instruct is about 1 GB to download.</div>
  </div>

  <div id="log" aria-live="polite"></div>

  <form id="ask">
    <textarea id="text" placeholder="Load a model, then ask something" disabled></textarea>
    <button id="send" disabled>Send</button>
    <button id="reset" class="plain" type="button" disabled>Reset</button>
  </form>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  $('model').value = params.get('model') ||
    'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/main/';

  const worker = new Worker('worker.js');
  let reply = null;

  function status(text, error = false) {
    $('status').textContent = text;
    $('status').classList.toggle('error', error);
  }
  function bubble(cls, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    $('log').append(div);
    div.scrollIntoView({ block: 'end' });
    return div;
  }
  function ready(on) {
    for (const id of ['text', 'send', 'reset']) $(id).disabled = !on;
  }
  const mb = (n) => (n / 1e6).toFixed(0) + ' MB';

  worker.onmessage = ({ data }) => {
    if (data.type === 'progress') {
      $('progress').hidden = false;
      $('progress').value = data.total ? data.got / data.total : 0;
      if (!data.total) $('progress').removeAttribute('value');
      status(data.total ? `${data.label}: ${mb(data.got)} of ${mb(data.total)}` : data.label + '…');
    } else if (data.type === 'ready') {
      $('progress').hidden = true;
      status(`Ready (weights converted in ${data.seconds.toFixed(1)} s).`);
      ready(true);
      $('text').focus();
    } else if (data.type === 'token') {
      reply.text.textContent += data.text;
      reply.div.scrollIntoView({ block: 'end' });
    } else if (data.type === 'done') {
      const tps = data.tokens / Math.max(data.decodeSeconds, 1e-6);
      const stats = document.createElement('div');
      stats.className = 'stats';
      stats.textContent = `${data.tokens} tokens · ${tps.toFixed(1)} tok/s · prompt ${data.prefillSeconds.toFixed(2)} s`;
      reply.div.append(stats);
      reply = null;
      ready(true);
      $('text').focus();
    } else if (data.type === 'error') {
      status(data.message, true);
      $('load').disabled = false;
      ready(!!reply || $('text').dataset.loaded === '1');
      reply = null;
    }
  };

  $('load').onclick = () => {
    $('load').disabled = true;
    ready(false);
    status('Starting…');
    let base = $('model').value.trim();
    if (!base.endsWith('/')) base += '/';
    worker.postMessage({ type: 'load', base: new URL(base, location.href).href, format: Number($('format').value) });
  };
  $('ask').onsubmit = (e) => {
    e.preventDefault();
    const text = $('text').value.trim();
    if (!text || reply) return;
    $('text').value = '';
    bubble('user', text);
    const div = bubble('bot', '');
    const span = document.createElement('span');
    div.append(span);
    reply = { div, text: span };
    ready(false);
    worker.postMessage({ type: 'chat', text, maxTokens: 512, temperature: 0.7 });
  };
  $('text').onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('ask').requestSubmit(); }
  };
  $('reset').onclick = () => {
    worker.postMessage({ type: 'reset' });
    $('log').replaceChildren();
  };
</script>
</body>
</html>
