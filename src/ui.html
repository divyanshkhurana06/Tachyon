<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tachyon</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
    --accent: #2f6fed; --you: #eef3fe; --code: #f1f1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --panel: #1c1c1c; --text: #ececea; --muted: #9a9a94; --line: #2c2c2a;
      --accent: #6f9bff; --you: #1d2638; --code: #242422;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, sans-serif; }
  .app { max-width: 820px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 18px 0 12px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  header .info { color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; max-width: 100%; }
  .user { background: var(--you); align-self: flex-end; max-width: 85%; }
  .assistant { background: var(--panel); border: 1px solid var(--line); }
  .stats { color: var(--muted); font-size: 12px; margin-top: 6px; white-space: normal; }
  pre { background: var(--code); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 6px 0; white-space: pre; }
  .empty { color: var(--muted); text-align: center; margin: auto; }
  form { display: flex; gap: 8px; padding: 12px 0 18px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; height: 46px; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
             background: var(--panel); color: var(--text); font: inherit; }
  button { border: 0; border-radius: 10px; padding: 0 18px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header><h1>Tachyon</h1><span class="info" id="info">connecting…</span></header>
  <div id="log"><div class="empty" id="empty">Ask anything. Tokens stream in as they are generated.</div></div>
  <form id="form">
    <textarea id="input" placeholder="Message" autofocus></textarea>
    <button id="send">Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');
const history = [];

fetch('/info').then(r => r.json()).then(i => {
  document.getElementById('info').textContent =
    `${i.model} · ${(i.params / 1e6).toFixed(0)}M params · ${i.backend} · ${i.context} ctx`;
}).catch(() => { document.getElementById('info').textContent = 'offline'; });

function escape(s) {
  return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

// Plain text with ``` fenced blocks shown as code.
function render(text) {
  return text.split('```').map((part, i) => {
    if (i % 2 === 0) return escape(part);
    const body = part.replace(/^[\w+-]*\n/, '');
    return `<pre>${escape(body)}</pre>`;
  }).join('');
}

function bubble(role, text) {
  document.getElementById('empty')?.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = render(text);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function ask(question) {
  history.push({ role: 'user', content: question });
  bubble('user', question);
  const out = bubble('assistant', '');
  let text = '';
  send.disabled = true;
  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, stream: true }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let last = null;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split('\n\n');
      buffer = events.pop();
      for (const ev of events) {
        const data = ev.replace(/^data: /, '');
        if (data === '[DONE]') continue;
        const chunk = JSON.parse(data);
        if (chunk.error) throw new Error(chunk.error);
        text += chunk.choices?.[0]?.delta?.content ?? '';
        if (chunk.timings) last = chunk;
        out.innerHTML = render(text);
        log.scrollTop = log.scrollHeight;
      }
    }
    history.push({ role: 'assistant', content: text });
    if (last) {
      const t = last.timings, u = last.usage;
      const stats = document.createElement('div');
      stats.className = 'stats';
      stats.textContent = `${u.completion_tokens} tokens · ${t.decode_tokens_per_second.toFixed(1)} tok/s · ` +
        `first token in ${(t.time_to_first_token * 1000).toFixed(0)} ms · ${t.cached_tokens} of ${u.prompt_tokens} prompt tokens cached`;
      out.appendChild(stats);
    }
  } catch (e) {
    out.textContent = `Error: ${e.message}`;
    history.pop();
  } finally {
    send.disabled = false;
    input.focus();
  }
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || send.disabled) return;
  input.value = '';
  ask(q);
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('form').requestSubmit(); }
});
</script>
</body>
</html>
