name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Cache the test model
        uses: actions/cache@v4
        with:
          path: models
          key: qwen2.5-0.5b-instruct-v1

      - name: Download the test model
        run: |
          mkdir -p models/qwen2.5-0.5b-instruct && cd models/qwen2.5-0.5b-instruct
          for f in config.json generation_config.json tokenizer.json model.safetensors; do
            [ -f "$f" ] || curl -sSfLO "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/main/$f"
          done

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        run: cargo test --release
